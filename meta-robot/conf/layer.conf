# ─────────────────────────────────────────────────────────────────────────────
#  meta-robot — Capa Yocto del Proyecto I: Robot Aspiradora Autonomo
#  CE-1113 Sistemas Empotrados, Instituto Tecnologico de Costa Rica
# ─────────────────────────────────────────────────────────────────────────────

# Ruta de busqueda de la capa
BBPATH .= ":${LAYERDIR}"

# Recetas y bbappends que aporta la capa
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-robot"
BBFILE_PATTERN_meta-robot = "^${LAYERDIR}/"

# Prioridad 10: por encima de meta-raspberrypi (9) y de poky (5), para que los
# bbappends de esta capa ganen sobre los del BSP.
BBFILE_PRIORITY_meta-robot = "10"

# Rama de Yocto con la que esta capa es compatible. Si se cambia de release hay
# que revisar las recetas y actualizar este valor.
LAYERSERIES_COMPAT_meta-robot = "scarthgap"

# Capas de las que depende. BitBake aborta con un mensaje claro si falta alguna,
# en lugar de fallar mas adelante con un "Nothing PROVIDES".
LAYERDEPENDS_meta-robot = " \
    core \
    raspberrypi \
    openembedded-layer \
    multimedia-layer \
    networking-layer \
"

LAYERVERSION_meta-robot = "1"
