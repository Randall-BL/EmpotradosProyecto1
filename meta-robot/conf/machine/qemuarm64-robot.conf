#@TYPE: Machine
#@NAME: QEMU ARMv8 para el robot aspiradora
#@DESCRIPTION: qemuarm64 de poky con el tune Cortex-A72 de la Raspberry Pi 4, para
#@DESCRIPTION: arrancar robot-image completa con runqemu sin el kit.

# ─────────────────────────────────────────────────────────────────────────────
#  Por que una maquina propia y no qemuarm64 a secas
#
#  qemuarm64 compila todo el userspace con el tune cortexa57. La RPi4 usa
#  cortexa72, asi que con qemuarm64 bitbake recompilaria glibc, systemd y el
#  resto de paquetes desde cero. Con el mismo tune que la Pi, esos paquetes
#  salen del sstate-cache del build de raspberrypi4-64 y solo se compilan el
#  kernel (linux-yocto) y el propio QEMU. Ademas, el userspace que corre en la
#  emulacion es binariamente el mismo que corre en la Pi.
#
#  El resto es copia de meta/conf/machine/qemuarm64.conf (poky scarthgap).
#  MACHINEOVERRIDES agrega "qemuarm64" para que linux-yocto reconozca la maquina
#  (COMPATIBLE_MACHINE, KMACHINE, KBRANCH) y "qemuall" viene de qemu.inc.
#
#  Uso:  MACHINE=qemuarm64-robot bitbake robot-image
#        MACHINE=qemuarm64-robot runqemu robot-image nographic slirp
#  Ver docs/qemu.md.
# ─────────────────────────────────────────────────────────────────────────────

require conf/machine/include/arm/armv8a/tune-cortexa72.inc
require conf/machine/include/qemu.inc

MACHINEOVERRIDES =. "qemuarm64:"

# linux-yocto busca la definicion de BSP por KMACHINE, que por defecto vale
# ${MACHINE}. En el kernel-cache solo existe "qemuarm64", asi que sin esto
# do_kernel_metadata falla con "Could not locate BSP definition".
KMACHINE = "qemuarm64"

KERNEL_IMAGETYPE = "Image"

SERIAL_CONSOLES ?= "115200;ttyAMA0 115200;hvc0"

# ── runqemu ──────────────────────────────────────────────────────────────────
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_MACHINE = "-machine virt"
QB_CPU = "-cpu cortex-a72"
QB_SMP ?= "-smp 4"
# 256 MB (el valor por defecto de qemuboot) queda justo con systemd y el
# servidor corriendo; la Pi del curso tiene bastante mas.
QB_MEM = "-m 512"
QB_CPU_KVM = "-cpu host -machine gic-version=3"
QB_GRAPHICS = "-device virtio-gpu-pci"
QB_OPT_APPEND = "-device qemu-xhci -device usb-tablet -device usb-kbd"
QB_TAP_OPT = "-netdev tap,id=net0,ifname=@TAP@,script=no,downscript=no"
QB_NETWORK_DEVICE = "-device virtio-net-pci,netdev=net0,mac=@MAC@"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-pci,drive=disk0"
QB_SERIAL_OPT = "-device virtio-serial-pci -chardev null,id=virtcon -device virtconsole,chardev=virtcon"
QB_TCPSERIAL_OPT = "-device virtio-serial-pci -chardev socket,id=virtcon,port=@PORT@,host=127.0.0.1,nodelay=on -device virtconsole,chardev=virtcon"

# Con slirp (no necesita sudo) runqemu solo reenvia SSH y telnet. Se agrega el
# 8080 para abrir el panel de control desde el navegador del host:
#   http://localhost:8080      ssh -p 2222 root@localhost
# Si el puerto esta ocupado, runqemu toma el siguiente libre y lo imprime.
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:8080-:8080"
